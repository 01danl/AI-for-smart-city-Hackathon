name: astana-walk

x-app: &app
  image: astana-walk:local
  build:
    context: .
    args:
      INSTALL_VECTOR: ${INSTALL_VECTOR:-false}
  init: true
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    POI_DATA_PATH: data/poi.json
    CHROMA_DIR: /app/state/chroma
    FEEDBACK_PATH: /app/state/feedback.jsonl
    HF_HOME: /app/state/huggingface
  volumes:
    - app-state:/app/state

services:
  ui:
    <<: *app
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  api:
    <<: *app
    command: ["uvicorn", "backend.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert data['status'] == 'ok' and data['poi_count'] > 0"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  app-state:
