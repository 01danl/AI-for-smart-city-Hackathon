[project]
name = "astana-walk-ai"
version = "0.1.0"
description = "Astana walking recommendations with sourced POIs and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "httpx>=0.27",
    "streamlit-js-eval>=1.0.0",
    "segno>=1.6",
]

[project.optional-dependencies]
vector = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
